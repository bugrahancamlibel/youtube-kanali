name: Yayin
# Her gün 20:35 ve 21:35 (Türkiye saati) çalışır, sırası gelen videoyu Upload-Post'a gönderir.
# Elle çalıştırmak için: Actions > Yayin > Run workflow.
on:
  schedule:
    - cron: '35 17,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sadece planı göster, hiçbir şey gönderme'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Sırası geleni yayınla
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python publisher/publish.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "yayin-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A projects YAYIN_TAKVIMI.md
          if ! git diff --cached --quiet; then
            git commit -m "Yayin durumu guncellendi"
            git pull --rebase
            git push
          fi
