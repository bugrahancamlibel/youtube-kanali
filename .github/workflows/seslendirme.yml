name: Seslendirme
# ElevenLabs API ile bir projenin anlatımını üretir (anahtar repo secret'ında durur) ve
# sonucu videolar dalına <proje>/vo.mp3 olarak koyar. Haftalık Claude çalışması bunu otomatik tetikler.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Proje klasörü (örnek: 04-quantum-qday)'
        required: true

permissions:
  contents: write

concurrency:
  group: seslendirme
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Proje adını kontrol et
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          [[ "$PROJECT" =~ ^[0-9]{2}-[a-z0-9-]+$ ]] || { echo "::error::geçersiz proje adı: $PROJECT"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Ses üret
        env:
          PROJECT: ${{ inputs.project }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python publisher/tts.py
      - name: Sesi videolar dalına koy
        env:
          PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout -b videolar \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/v
          cd /tmp/v
          git sparse-checkout set "$PROJECT"
          git checkout videolar
          mkdir -p "$PROJECT"
          cp "$GITHUB_WORKSPACE/out/vo.mp3" "$GITHUB_WORKSPACE/out/vo.json" "$PROJECT/"
          git config user.name "seslendirme-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROJECT"
          git commit -m "ses: $PROJECT"
          git push
